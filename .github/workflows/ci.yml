name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, lab10]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Odrębna, odtwarzana baza testowa CI (lokalny kontener, nazwa *_test); bez sekretów produkcyjnych.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/shop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/shop_test
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0000
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
